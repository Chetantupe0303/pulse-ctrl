<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PulseCtrl Phone</title>
  <link rel="stylesheet" href="phone.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="phone-header">
      <div class="brand-section">
        <span class="brand-logo">⚡</span>
        <span class="brand-name">PulseCtrl</span>
      </div>

      <div id="phoneStatusPill" class="status-pill status-waiting">
        <span class="status-dot"></span>
        <span id="phoneStatusText">Connecting...</span>
      </div>

      <button id="phoneDisconnectBtn" class="btn-header-disconnect">Disconnect</button>
    </header>

    <!-- Mode Switcher Tabs -->
    <nav class="mode-tabs">
      <button class="tab-btn active" data-mode="trackpad">
        <span>🖱️</span> Trackpad
      </button>
      <button class="tab-btn" data-mode="keyboard">
        <span>⌨️</span> Keyboard
      </button>
      <button class="tab-btn" data-mode="both">
        <span>⚡</span> Both
      </button>
    </nav>

    <!-- Hidden text input for native mobile keyboard -->
    <input type="text" id="nativeKeyboardInput" class="hidden-text-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <!-- Content Area with 3 Modes -->
    <main class="content-area">
      <!-- 1. Trackpad Panel -->
      <section id="panelTrackpad" class="view-panel active">
        <div id="touchSurface" class="trackpad-surface">
          <div class="trackpad-hint">
            <strong>Touchpad</strong><br>
            1 finger drag: Move cursor<br>
            1 finger tap: Left click<br>
            2 finger tap: Right click<br>
            2 finger drag: Scroll
          </div>
        </div>
      </section>

      <!-- 2. Keyboard Panel -->
      <section id="panelKeyboard" class="view-panel">
        <div class="keyboard-container">
          <div class="keyboard-trigger-card">
            <button id="btnOpenKeyboard" class="btn-open-keyboard">
              <span>⌨️</span> Tap to type with phone keyboard
            </button>
          </div>

          <div class="key-grid-title">Special Keys</div>
          <div class="key-grid">
            <button class="key-btn" data-key="Escape">Esc</button>
            <button class="key-btn" data-key="Tab">Tab</button>
            <button class="key-btn key-span-2" data-key="Backspace">⌫ Backspace</button>

            <button class="key-btn key-span-2" data-key="Enter">⏎ Enter</button>
            <button class="key-btn" data-key="ArrowUp">↑</button>
            <button class="key-btn modifier" data-modifier="Shift">Shift</button>

            <button class="key-btn" data-key="ArrowLeft">←</button>
            <button class="key-btn" data-key="ArrowDown">↓</button>
            <button class="key-btn" data-key="ArrowRight">→</button>
            <button class="key-btn modifier" data-modifier="Control">Ctrl</button>

            <button class="key-btn modifier key-span-2" data-modifier="Alt">Alt</button>
            <button class="key-btn key-span-2" data-key="Space">Space</button>
          </div>
        </div>
      </section>

      <!-- 3. Both Panel -->
      <section id="panelBoth" class="view-panel">
        <div class="both-layout">
          <div class="both-trackpad-wrap">
            <div id="touchSurfaceBoth" class="trackpad-surface">
              <div class="trackpad-hint">
                <strong>Trackpad Area</strong><br>
                Drag to move • Tap to click
              </div>
            </div>
          </div>
          <div class="both-keyboard-wrap">
            <button id="btnOpenKeyboardBoth" class="btn-open-keyboard" style="padding: 10px; margin-bottom: 8px; font-size: 13px;">
              <span>⌨️</span> Tap to type
            </button>
            <div class="key-grid" style="margin-bottom: 0;">
              <button class="key-btn" data-key="Escape">Esc</button>
              <button class="key-btn" data-key="Tab">Tab</button>
              <button class="key-btn key-span-2" data-key="Backspace">⌫</button>

              <button class="key-btn key-span-2" data-key="Enter">⏎ Enter</button>
              <button class="key-btn" data-key="ArrowUp">↑</button>
              <button class="key-btn modifier" data-modifier="Shift">Shift</button>

              <button class="key-btn" data-key="ArrowLeft">←</button>
              <button class="key-btn" data-key="ArrowDown">↓</button>
              <button class="key-btn" data-key="ArrowRight">→</button>
              <button class="key-btn modifier" data-modifier="Control">Ctrl</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Overlay Screen: Waiting for approval, disconnected, or error -->
    <div id="overlayScreen" class="overlay-screen">
      <div id="overlayIcon" class="overlay-icon">⏳</div>
      <h2 id="overlayTitle" class="overlay-title">Connecting...</h2>
      <p id="overlayDesc" class="overlay-desc">Please wait while pairing with your laptop.</p>
    </div>
  </div>

  <script src="phone.js"></script>
</body>
</html>
